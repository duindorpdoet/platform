name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - production
      - build/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    name: Resolve release mail-test policy
    runs-on: ubuntu-latest
    outputs:
      skip_mail_tests: ${{ steps.policy.outputs.skip_mail_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Record exact release exception
        id: policy
        env:
          SKIP_MAIL_TESTS_REQUESTED: "false"
          MAIL_TEST_WAIVER_SHA: ${{ vars.MAIL_TEST_WAIVER_SHA }}
          MAIL_TEST_WAIVER_EXPIRES_AT: ${{ vars.MAIL_TEST_WAIVER_EXPIRES_AT }}
          MAIL_TEST_WAIVER_REASON: ${{ vars.MAIL_TEST_WAIVER_REASON }}
        run: node scripts/deploy/mail-test-policy.mjs
  application:
    name: Application and browser tests
    needs: release-policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENVIRONMENT: test
      REGISTRATION_MODE: closed
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test and build
        run: pnpm verify
      - name: Install Chromium
        run: |
          bash scripts/acceptance/prepare-browser-runner.sh
          pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: pnpm test:e2e

  database:
    name: Database migrations, contracts and lint
    needs: release-policy
    runs-on: ubuntu-latest
    # The complete authenticated browser suite exceeded 60 minutes on a shared
    # hosted runner; preserve every check and allow bounded cleanup time.
    timeout-minutes: 90
    env:
      SKIP_MAIL_TESTS: ${{ needs.release-policy.outputs.skip_mail_tests }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm exec supabase start >/tmp/duindorp-supabase-start.log 2>&1
      - name: Rebuild database from migrations
        run: pnpm exec supabase db reset
      - name: Run pgTAP contracts
        run: pnpm exec supabase test db
      - name: Measure bounded planboard reads on synthetic event sizes
        run: |
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" BOARD_BENCH_REQUIRE_FAST=true node scripts/acceptance/live-planboard-performance.mjs
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" BOARD_BENCH_GROUPS=50 BOARD_BENCH_PORTALS=30 BOARD_BENCH_REQUIRE_FAST=true node scripts/acceptance/live-planboard-performance.mjs
      - name: Verify exact backup fingerprints across PostgreSQL render settings
        env:
          BACKUP_FINGERPRINT_DB_CONTAINER: supabase_db_duindorphalloween
        run: node scripts/acceptance/backup-fingerprints.mjs
      - name: Verify existing mail event preservation during signed provider appends
        env:
          BACKUP_FINGERPRINT_DB_CONTAINER: supabase_db_duindorphalloween
        run: node scripts/acceptance/mail-event-preservation.mjs
      - name: Exercise full planboard and signed Resend mail chain locally
        if: needs.release-policy.outputs.skip_mail_tests != 'true'
        env:
          MAIL_INTEGRATION_CONTAINER: supabase_db_duindorphalloween
        run: pnpm exec vitest run tests/integration/resend-planboard.test.ts
      - name: Restore isolated fixtures after mail chain acceptance
        run: pnpm exec supabase db reset
      - name: Verify one-time Nachtpost account activation
        if: needs.release-policy.outputs.skip_mail_tests != 'true'
        env:
          LOCAL_DB_CONTAINER: supabase_db_duindorphalloween
        run: node scripts/acceptance/nachtpost-activation.mjs
      - name: Run local Auth one-time-code acceptance
        if: needs.release-policy.outputs.skip_mail_tests != 'true'
        run: |
          eval "$(pnpm exec supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" MAILPIT_URL="$MAILPIT_URL" node scripts/acceptance/local-auth.mjs
      - name: Run true parallel transaction acceptance
        run: |
          eval "$(pnpm exec supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" node scripts/acceptance/concurrency.mjs
      - name: Run together cluster concurrency acceptance
        run: |
          eval "$(pnpm exec supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" node scripts/acceptance/together-concurrency.mjs
      - name: Rebuild fixtures for local load acceptance
        run: pnpm exec supabase db reset
      - name: Run 200-client local load acceptance
        run: |
          eval "$(pnpm exec supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" node scripts/acceptance/load.mjs
      - name: Rebuild fixtures for authenticated browser acceptance
        run: pnpm exec supabase db reset
      - name: Build application against local Auth and API
        env:
          APP_ENVIRONMENT: test
          REGISTRATION_MODE: staging_test
          APP_URL: http://127.0.0.1:3100
          ALLOWED_ORIGINS: http://127.0.0.1:3100
          ABUSE_HASH_SECRET: local-ci-portal-registration-hash-secret
        run: |
          eval "$(pnpm exec supabase status -o env)"
          export NEXT_PUBLIC_VAPID_PUBLIC_KEY="$(node --input-type=module -e 'import webPush from "web-push"; console.log(webPush.generateVAPIDKeys().publicKey)')"
          echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY=$NEXT_PUBLIC_VAPID_PUBLIC_KEY" >> "$GITHUB_ENV"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" pnpm build
      - name: Install Chromium and WebKit for authenticated browser acceptance
        run: |
          bash scripts/acceptance/prepare-browser-runner.sh
          pnpm exec playwright install --with-deps chromium webkit
      - name: Exercise real Startregie, group policy and push HTTP boundaries
        env:
          APP_ENVIRONMENT: test
          REGISTRATION_MODE: staging_test
          APP_URL: http://127.0.0.1:3100
          ALLOWED_ORIGINS: http://127.0.0.1:3100
          ABUSE_HASH_SECRET: local-ci-portal-registration-hash-secret
        run: |
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" node scripts/acceptance/group-size-policy.mjs
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" node scripts/acceptance/start-ops-concurrency.mjs
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" pnpm exec playwright test tests/e2e/start-ops.spec.ts tests/e2e/start-location.spec.ts --project=desktop-chromium --workers=1
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" pnpm exec playwright test tests/e2e/portal-sequence.spec.ts --project=desktop-chromium --workers=1
          pnpm exec supabase db reset
      - name: Exercise coherent grouping and reservation races
        run: |
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" node scripts/acceptance/start-departure-concurrency.mjs
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" node scripts/acceptance/finale-overrun-concurrency.mjs
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" node scripts/acceptance/group-operations-concurrency.mjs
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" pnpm exec playwright test tests/e2e/group-operations.spec.ts --project=desktop-chromium --workers=1
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" pnpm exec playwright test tests/e2e/finale-target.spec.ts --project=desktop-chromium --workers=1
          pnpm exec supabase db reset
      - name: Verify saved start readiness, released entrances and world compensation
        env:
          APP_ENVIRONMENT: test
          REGISTRATION_MODE: staging_test
          APP_URL: http://127.0.0.1:3100
          ALLOWED_ORIGINS: http://127.0.0.1:3100
          ABUSE_HASH_SECRET: local-ci-portal-registration-hash-secret
        run: |
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" node scripts/acceptance/world-policy-preservation.mjs
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" node scripts/acceptance/live-planboard-read-concurrency.mjs
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" node scripts/acceptance/world-compensation-concurrency.mjs
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" pnpm exec playwright test tests/e2e/start-readiness-time.spec.ts --project=desktop-chromium --workers=1
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" pnpm exec playwright test tests/e2e/released-destination.spec.ts --project=desktop-chromium --workers=1
          pnpm exec supabase db reset
      - name: Verify organizer family creation, activation, editing and targeted moves
        env:
          APP_ENVIRONMENT: test
          REGISTRATION_MODE: staging_test
          MAIL_MODE: disabled
          APP_URL: http://127.0.0.1:3100
          ALLOWED_ORIGINS: http://127.0.0.1:3100
          ABUSE_HASH_SECRET: local-ci-registration-management-hash-secret
        run: |
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" node scripts/acceptance/registration-activation-concurrency.mjs
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" node scripts/acceptance/registration-management-concurrency.mjs
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" pnpm exec playwright test tests/e2e/registration-management.spec.ts --project=desktop-chromium --workers=1
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" pnpm exec playwright test tests/e2e/registration-management.spec.ts --project=mobile-chromium --workers=1
          pnpm exec supabase db reset
      - name: Verify shared route proposals, physical policy and true-time planboard
        env:
          APP_ENVIRONMENT: test
          REGISTRATION_MODE: staging_test
          MAIL_MODE: disabled
          APP_URL: http://127.0.0.1:3100
          ALLOWED_ORIGINS: http://127.0.0.1:3100
          ABUSE_HASH_SECRET: local-ci-joint-route-hash-secret
        run: |
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" node scripts/acceptance/joint-route-concurrency.mjs
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" pnpm exec playwright test tests/e2e/joint-route-planboard.spec.ts --project=desktop-chromium --workers=1
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" pnpm exec playwright test tests/e2e/joint-route-planboard.spec.ts --project=mobile-chromium --workers=1
          pnpm exec supabase db reset
      - name: Run offline, reconnect and private-payload browser acceptance
        env:
          APP_ENVIRONMENT: test
          REGISTRATION_MODE: staging_test
          APP_URL: http://127.0.0.1:3100
          ALLOWED_ORIGINS: http://127.0.0.1:3100
          ABUSE_HASH_SECRET: local-ci-portal-registration-hash-secret
        run: |
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" pnpm exec playwright test tests/e2e/authenticated-live.spec.ts tests/e2e/homeowner-responsive.spec.ts tests/e2e/participant-mobile-polish.spec.ts tests/e2e/together-management.spec.ts tests/e2e/contact-identity.spec.ts --project=desktop-chromium --workers=1
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" pnpm exec playwright test tests/e2e/together-management.spec.ts tests/e2e/contact-identity.spec.ts --project=mobile-chromium
      - name: Verify portal identity, admin submission and realtime refresh pressure
        env:
          APP_ENVIRONMENT: test
          REGISTRATION_MODE: staging_test
          APP_URL: http://127.0.0.1:3187
          ALLOWED_ORIGINS: http://127.0.0.1:3187
          ABUSE_HASH_SECRET: local-ci-portal-registration-hash-secret
          TOGETHER_TEST_DB_CONTAINER: supabase_db_duindorphalloween
        run: |
          pnpm exec supabase db reset
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" pnpm exec playwright test --config playwright.realtime.config.ts
      - name: Run mobile PWA invitation and attendance acceptance
        env:
          APP_ENVIRONMENT: test
          REGISTRATION_MODE: staging_test
          APP_URL: http://127.0.0.1:3100
          ALLOWED_ORIGINS: http://127.0.0.1:3100
        run: |
          pnpm exec supabase db reset
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" pnpm exec playwright test tests/e2e/pwa-attendance.spec.ts --project=mobile-chromium --workers=1
      - name: Run child credential concurrency and private HTTPS browser flows
        env:
          APP_ENVIRONMENT: staging
          POORTENBOEK_DEMO_ENABLED: "true"
          REGISTRATION_MODE: staging_test
          APP_URL: https://127.0.0.1:3443
          ALLOWED_ORIGINS: https://127.0.0.1:3443,http://127.0.0.1:3100
          ABUSE_HASH_SECRET: local-ci-portal-registration-hash-secret
        run: |
          eval "$(pnpm exec supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY"
          export CHILD_CODE_PEPPER="$(openssl rand -base64 32)" CHILD_CODE_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          node scripts/acceptance/poortenboek-concurrency.mjs
          NEXT_PUBLIC_SUPABASE_URL=https://127.0.0.1:3444 pnpm build
          pnpm exec playwright test --config playwright.poortenboek.config.ts
          pnpm exec supabase db reset
          pnpm exec playwright test --config playwright.ops-chain.config.ts
          pnpm exec supabase db reset
          node scripts/acceptance/poortkamer-concurrency.mjs
          pnpm exec playwright test --config playwright.poortkamer.config.ts
      - name: Run real live planboard, mail settings and parent recovery acceptance over HTTPS
        env:
          MAIL_ADMIN_USER_IDS: f0000000-0000-0000-0000-000000000001
          APP_ENVIRONMENT: staging
          POORTENBOEK_DEMO_ENABLED: "true"
          REGISTRATION_MODE: staging_test
          APP_URL: https://127.0.0.1:3443
          ALLOWED_ORIGINS: https://127.0.0.1:3443,http://127.0.0.1:3100
          ABUSE_HASH_SECRET: local-ci-planboard-hash-secret
        run: |
          pnpm exec supabase db reset
          eval "$(pnpm exec supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY"
          export CHILD_CODE_PEPPER="$(openssl rand -base64 32)" CHILD_CODE_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          node scripts/acceptance/resend-release-config.mjs
          pnpm exec playwright test --config playwright.planboard.config.ts
          pnpm exec playwright test --config playwright.account-app.config.ts
          pnpm exec supabase db reset
          pnpm exec playwright test --config playwright.guidance.config.ts
      - name: Verify persistent printable gate QR and manual codes over HTTPS
        env:
          APP_ENVIRONMENT: staging
          POORTENBOEK_DEMO_ENABLED: "true"
          REGISTRATION_MODE: staging_test
          MAIL_MODE: disabled
          APP_URL: https://127.0.0.1:3443
          ALLOWED_ORIGINS: https://127.0.0.1:3443,http://127.0.0.1:3100
          ABUSE_HASH_SECRET: local-ci-gate-print-hash-secret
        run: |
          eval "$(pnpm exec supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY"
          export CHILD_CODE_PEPPER="$(openssl rand -base64 32)" CHILD_CODE_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          pnpm exec supabase db reset
          pnpm exec playwright test --config playwright.portal-qr.config.ts --project=qr-desktop
          pnpm exec supabase db reset
          pnpm exec playwright test --config playwright.portal-qr.config.ts --project=qr-mobile
          pnpm exec supabase db reset
      - name: Run editorial publication, newsletter and push acceptance
        env:
          APP_ENVIRONMENT: staging
          REGISTRATION_MODE: staging_test
          REDACTIEKAMER_ENABLED: "true"
          NEWSLETTER_SENDING_ENABLED: "true"
          WEB_PUSH_SENDING_ENABLED: "true"
          EDITORIAL_ALLOWED_RECIPIENTS: admin@example.invalid,parent-a@example.invalid
          APP_URL: https://127.0.0.1:3443
          NEXT_PUBLIC_SITE_URL: https://127.0.0.1:3443
          ALLOWED_ORIGINS: https://127.0.0.1:3443,http://127.0.0.1:3100
        run: |
          pnpm exec supabase db reset
          eval "$(pnpm exec supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY"
          export EDITORIAL_TOKEN_SECRET="$(openssl rand -hex 32)"
          node scripts/acceptance/editorial-concurrency.mjs
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL=https://127.0.0.1:3444 pnpm build
          pnpm exec playwright test --config playwright.editorial.config.ts
      - name: Lint database schemas
        run: pnpm exec supabase db lint --level warning
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
