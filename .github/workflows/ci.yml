name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - production
      - build/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENVIRONMENT: test
      REGISTRATION_MODE: closed
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test and build
        run: pnpm verify
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: pnpm test:e2e

  database:
    name: Database migrations, contracts and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm exec supabase start >/tmp/duindorp-supabase-start.log 2>&1
      - name: Rebuild database from migrations
        run: pnpm exec supabase db reset
      - name: Run pgTAP contracts
        run: pnpm exec supabase test db
      - name: Verify one-time Nachtpost account activation
        env:
          LOCAL_DB_CONTAINER: supabase_db_duindorphalloween
        run: node scripts/acceptance/nachtpost-activation.mjs
      - name: Run local Auth one-time-code acceptance
        run: |
          eval "$(pnpm exec supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" MAILPIT_URL="$MAILPIT_URL" node scripts/acceptance/local-auth.mjs
      - name: Run true parallel transaction acceptance
        run: |
          eval "$(pnpm exec supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" node scripts/acceptance/concurrency.mjs
      - name: Run together cluster concurrency acceptance
        run: |
          eval "$(pnpm exec supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" node scripts/acceptance/together-concurrency.mjs
      - name: Rebuild fixtures for local load acceptance
        run: pnpm exec supabase db reset
      - name: Run 200-client local load acceptance
        run: |
          eval "$(pnpm exec supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" node scripts/acceptance/load.mjs
      - name: Rebuild fixtures for authenticated browser acceptance
        run: pnpm exec supabase db reset
      - name: Build application against local Auth and API
        env:
          APP_ENVIRONMENT: test
          REGISTRATION_MODE: staging_test
          APP_URL: http://127.0.0.1:3100
          ALLOWED_ORIGINS: http://127.0.0.1:3100
          ABUSE_HASH_SECRET: local-ci-portal-registration-hash-secret
        run: |
          eval "$(pnpm exec supabase status -o env)"
          export NEXT_PUBLIC_VAPID_PUBLIC_KEY="$(node --input-type=module -e 'import webPush from "web-push"; console.log(webPush.generateVAPIDKeys().publicKey)')"
          echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY=$NEXT_PUBLIC_VAPID_PUBLIC_KEY" >> "$GITHUB_ENV"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" pnpm build
      - name: Install Chromium and WebKit for authenticated browser acceptance
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run offline, reconnect and private-payload browser acceptance
        env:
          APP_ENVIRONMENT: test
          REGISTRATION_MODE: staging_test
          APP_URL: http://127.0.0.1:3100
          ALLOWED_ORIGINS: http://127.0.0.1:3100
          ABUSE_HASH_SECRET: local-ci-portal-registration-hash-secret
        run: |
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" pnpm exec playwright test tests/e2e/authenticated-live.spec.ts tests/e2e/homeowner-responsive.spec.ts tests/e2e/participant-mobile-polish.spec.ts tests/e2e/together-management.spec.ts --project=desktop-chromium --workers=1
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" pnpm exec playwright test tests/e2e/together-management.spec.ts --project=mobile-chromium
      - name: Run mobile PWA invitation and attendance acceptance
        env:
          APP_ENVIRONMENT: test
          REGISTRATION_MODE: staging_test
          APP_URL: http://127.0.0.1:3100
          ALLOWED_ORIGINS: http://127.0.0.1:3100
        run: |
          pnpm exec supabase db reset
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" pnpm exec playwright test tests/e2e/pwa-attendance.spec.ts --project=mobile-chromium --workers=1
      - name: Run child credential concurrency and private HTTPS browser flows
        env:
          APP_ENVIRONMENT: staging
          POORTENBOEK_DEMO_ENABLED: "true"
          REGISTRATION_MODE: staging_test
          APP_URL: https://127.0.0.1:3443
          ALLOWED_ORIGINS: https://127.0.0.1:3443,http://127.0.0.1:3100
          ABUSE_HASH_SECRET: local-ci-portal-registration-hash-secret
        run: |
          eval "$(pnpm exec supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY"
          export CHILD_CODE_PEPPER="$(openssl rand -base64 32)" CHILD_CODE_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          node scripts/acceptance/poortenboek-concurrency.mjs
          NEXT_PUBLIC_SUPABASE_URL=https://127.0.0.1:3444 pnpm build
          pnpm exec playwright test --config playwright.poortenboek.config.ts
          node scripts/acceptance/poortkamer-concurrency.mjs
          pnpm exec playwright test --config playwright.poortkamer.config.ts
      - name: Run editorial publication, newsletter and push acceptance
        env:
          APP_ENVIRONMENT: staging
          REGISTRATION_MODE: staging_test
          REDACTIEKAMER_ENABLED: "true"
          NEWSLETTER_SENDING_ENABLED: "true"
          WEB_PUSH_SENDING_ENABLED: "true"
          EDITORIAL_ALLOWED_RECIPIENTS: admin@example.invalid,parent-a@example.invalid
          APP_URL: https://127.0.0.1:3443
          NEXT_PUBLIC_SITE_URL: https://127.0.0.1:3443
          ALLOWED_ORIGINS: https://127.0.0.1:3443,http://127.0.0.1:3100
        run: |
          pnpm exec supabase db reset
          eval "$(pnpm exec supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY"
          export EDITORIAL_TOKEN_SECRET="$(openssl rand -hex 32)"
          node scripts/acceptance/editorial-concurrency.mjs
          pnpm exec supabase db reset
          NEXT_PUBLIC_SUPABASE_URL=https://127.0.0.1:3444 pnpm build
          pnpm exec playwright test --config playwright.editorial.config.ts
      - name: Lint database schemas
        run: pnpm exec supabase db lint --level warning
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
