name: Deploy production

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      database_connection_recovery:
        description: Explicit production database restart only after three independent connection failures; no deployment
        type: boolean
        default: false
        required: false
      database_recovery_reason:
        description: Required only for explicit recovery; explain the confirmed outage (20-500 characters)
        type: string
        required: false
      database_connection_diagnostics:
        description: Compare one native and one libpq session-pooler connection without SQL or deployment
        type: boolean
        default: false
        required: false
      database_diagnostics_scope:
        description: Connection-only diagnostic scope; direct capability also inventories local VPS tools
        type: choice
        default: pooler
        options:
          - pooler
          - direct-capability
          - public-client-build
        required: false
      skip_mail_tests:
        description: 'Explicitly skip all mail tests for this release run; other release gates remain required'
        type: boolean
        default: false
        required: false
      readonly_baseline:
        description: Capture read-only schema and preservation fingerprints; no deployment
        type: boolean
        default: false
      mail_worker_diagnostics:
        description: Inspect real worker RPCs and sanitized application error codes; no deployment or mail
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: production-duindorphalloween
  cancel-in-progress: false

jobs:
  public-client-build-diagnostics:
    name: Verify public PostgreSQL client build without database access
    if: github.event_name == 'workflow_dispatch' && inputs.database_connection_diagnostics == true && inputs.database_diagnostics_scope == 'public-client-build' && !inputs.database_connection_recovery && !inputs.readonly_baseline && !inputs.mail_worker_diagnostics && github.repository == 'duindorpdoet/platform' && (github.ref == 'refs/heads/codex/startregie-read-timeout-hotfix' || github.ref == 'refs/heads/production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Inspect the exact public registry pull without database credentials
        run: |
          set -euo pipefail
          PUBLIC_POSTGRES_CLIENT_IMAGE="$(node --input-type=module -e 'import { CLIENT_IMAGE } from "./scripts/deploy/portable-postgres-clients.mjs"; process.stdout.write(CLIENT_IMAGE)')"
          docker pull --quiet --platform linux/amd64 "${PUBLIC_POSTGRES_CLIENT_IMAGE}"
      - name: Build and verify only pinned public client files on a clean runner
        run: |
          set -euo pipefail
          node scripts/deploy/portable-postgres-clients.mjs build "${RUNNER_TEMP}/duindorp-public-client-proof"
          "${RUNNER_TEMP}/duindorp-public-client-proof/bin/psql" --version
          "${RUNNER_TEMP}/duindorp-public-client-proof/bin/pg_dump" --version
          "${RUNNER_TEMP}/duindorp-public-client-proof/bin/pg_restore" --version
  database-connection-recovery:
    name: Explicit guarded production database recovery without deployment
    if: github.event_name == 'workflow_dispatch' && inputs.database_connection_recovery == true && github.ref == 'refs/heads/production' && github.repository == 'duindorpdoet/platform' && !inputs.database_connection_diagnostics
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require independent outage evidence before one explicit restart request
        env:
          APP_ENVIRONMENT: production
          DATABASE_RECOVERY_REQUESTED: ${{ inputs.database_connection_recovery }}
          DATABASE_RECOVERY_REASON: ${{ inputs.database_recovery_reason }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/deploy/production-db-recovery.mjs
  database-connection-diagnostics:
    name: Inspect production database through its session pooler (read only)
    if: github.event_name == 'workflow_dispatch' && inputs.database_connection_diagnostics == true && inputs.database_diagnostics_scope == 'pooler' && !inputs.database_connection_recovery && github.ref == 'refs/heads/production' && github.repository == 'duindorpdoet/platform'
    environment:
      name: production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned release database driver for connection diagnosis
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Compare native and libpq connectivity without sending SQL
        env:
          DIAGNOSTIC_NATIVE_CONNECT_ONLY: "true"
          APP_ENVIRONMENT: production
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/deploy/production-db-diagnostics.mjs
  database-direct-capability:
    name: Compare direct native and libpq startup without SQL
    if: github.event_name == 'workflow_dispatch' && inputs.database_connection_diagnostics == true && inputs.database_diagnostics_scope == 'direct-capability' && !inputs.database_connection_recovery && github.ref == 'refs/heads/production' && github.repository == 'duindorpdoet/platform'
    environment:
      name: production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned release database driver for direct capability
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Open each verified direct connection once without sending SQL
        env:
          DIAGNOSTIC_NATIVE_CONNECT_ONLY: "true"
          DIAGNOSTIC_DIRECT_CAPABILITY: "true"
          APP_ENVIRONMENT: production
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/deploy/production-db-diagnostics.mjs
  database-vps-capability:
    name: Inventory existing VPS database client tools without network access
    if: github.event_name == 'workflow_dispatch' && inputs.database_connection_diagnostics == true && inputs.database_diagnostics_scope == 'direct-capability' && !inputs.database_connection_recovery && github.ref == 'refs/heads/production' && github.repository == 'duindorpdoet/platform'
    environment:
      name: production
      deployment: false
    runs-on:
      - self-hosted
      - Linux
      - X64
      - dg-sites
      - production
      - duindorphalloweenprod
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false
          ref: ${{ github.sha }}
      - name: Verify existing dedicated VPS runner boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "duindorphalloweenprod"
          test "${RUNNER_NAME}" = "dg-sites-vps-01-duindorphalloweenprod-01"
          [[ "${GITHUB_WORKSPACE}" == /srv/sites/duindorphalloweenprod/actions-runner/_work/* ]]
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Read only local versions and free space with the existing Node runtime
        env:
          DIAGNOSTIC_VPS_CAPABILITIES: "true"
          APP_ENVIRONMENT: production
        run: /srv/sites/duindorphalloweenprod/actions-runner/externals/node24/bin/node scripts/deploy/production-vps-capabilities.mjs
  mail-worker-diagnostics:
    name: Inspect mail worker RPC and application error codes
    if: github.event_name == 'workflow_dispatch' && inputs.mail_worker_diagnostics && !inputs.database_connection_diagnostics && !inputs.database_connection_recovery && github.ref == 'refs/heads/production'
    environment: production
    runs-on: [self-hosted, Linux, X64, dg-sites, production, duindorphalloweenprod]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          clean: false
      - name: Reproduce via PostgREST without changing an outbox row
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: /srv/sites/duindorphalloweenprod/actions-runner/externals/node24/bin/node scripts/deploy/diagnose-mail-worker.mjs
  release-policy:
    name: Resolve release mail-test policy
    runs-on: ubuntu-latest
    outputs:
      skip_mail_tests: ${{ steps.policy.outputs.skip_mail_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Record exact release exception
        id: policy
        env:
          SKIP_MAIL_TESTS_REQUESTED: ${{ inputs.skip_mail_tests || false }}
          MAIL_TEST_WAIVER_SHA: ${{ vars.MAIL_TEST_WAIVER_SHA }}
          MAIL_TEST_WAIVER_EXPIRES_AT: ${{ vars.MAIL_TEST_WAIVER_EXPIRES_AT }}
          MAIL_TEST_WAIVER_REASON: ${{ vars.MAIL_TEST_WAIVER_REASON }}
        run: node scripts/deploy/mail-test-policy.mjs
  readonly-baseline:
    name: Read-only production evening baseline
    if: github.event_name == 'workflow_dispatch' && inputs.readonly_baseline && !inputs.database_connection_diagnostics && !inputs.database_connection_recovery && github.ref == 'refs/heads/production'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Inventory through read-only queries
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy/evening-baseline.mjs
      - name: Audit saved routes and operational readiness without changing data
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy/evening-readiness-audit.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: evening-production-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/duindorp-evening-baseline/
          retention-days: 30
          if-no-files-found: error
  prepare-database-client:
    name: Prepare pinned public PostgreSQL clients for the existing VPS
    needs: release-policy
    if: github.ref == 'refs/heads/production' && !inputs.readonly_baseline && !inputs.mail_worker_diagnostics && !inputs.database_connection_diagnostics && !inputs.database_connection_recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require exact successful staging revision before preparing tools
        run: node scripts/deploy/require-staging-success.mjs
      - name: Prepare only pinned public PostgreSQL client binaries and libraries
        run: |
          set -euo pipefail
          PUBLIC_POSTGRES_CLIENT_IMAGE="$(node --input-type=module -e 'import { CLIENT_IMAGE } from "./scripts/deploy/portable-postgres-clients.mjs"; process.stdout.write(CLIENT_IMAGE)')"
          docker pull --quiet --platform linux/amd64 "${PUBLIC_POSTGRES_CLIENT_IMAGE}"
          node scripts/deploy/portable-postgres-clients.mjs build "${RUNNER_TEMP}/duindorp-pg-clients"
          "${RUNNER_TEMP}/duindorp-pg-clients/bin/psql" --version
          "${RUNNER_TEMP}/duindorp-pg-clients/bin/pg_dump" --version
          "${RUNNER_TEMP}/duindorp-pg-clients/bin/pg_restore" --version
      - name: Retain public tools bound to their complete fixed file hashes
        id: artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: production-postgres-clients-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/duindorp-pg-clients/
          retention-days: 2
          if-no-files-found: error
  backup-export:
    name: Export encrypted production snapshot directly from the existing VPS
    needs: [prepare-database-client, release-policy]
    if: github.ref == 'refs/heads/production' && !inputs.readonly_baseline && !inputs.mail_worker_diagnostics && !inputs.database_connection_diagnostics && !inputs.database_connection_recovery
    environment:
      name: production
      deployment: false
    runs-on: [self-hosted, Linux, X64, dg-sites, production, duindorphalloweenprod]
    timeout-minutes: 35
    env:
      APP_ENVIRONMENT: production
      RELEASE_READ_TRANSPORT: session-pooler
      RELEASE_BACKUP_MODE: export
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CHILD_CODE_ENCRYPTION_KEY: ${{ secrets.CHILD_CODE_ENCRYPTION_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false
          ref: ${{ github.sha }}
      - name: Verify existing dedicated production runner boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "duindorphalloweenprod"
          test "${RUNNER_NAME}" = "dg-sites-vps-01-duindorphalloweenprod-01"
          [[ "${GITHUB_WORKSPACE}" == /srv/sites/duindorphalloweenprod/actions-runner/_work/* ]]
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned release database driver
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Fetch only the prepared public client artifact from this run
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: ${{ needs.prepare-database-client.outputs.artifact }}
          path: ${{ runner.temp }}/duindorp-pg-clients
          merge-multiple: true
      - name: Verify every pinned client and library before execution
        env:
          RELEASE_PG_CLIENT_DIRECTORY: ${{ runner.temp }}/duindorp-pg-clients
        run: |
          set -euo pipefail
          node scripts/deploy/portable-postgres-clients.mjs verify "${RELEASE_PG_CLIENT_DIRECTORY}"
          printf 'RELEASE_PG_CLIENT_DIRECTORY=%s\n' "${RELEASE_PG_CLIENT_DIRECTORY}" >> "${GITHUB_ENV}"
          printf 'RELEASE_READ_CLIENT=libpq\n' >> "${GITHUB_ENV}"
      - name: Require exact successful staging revision
        run: node scripts/deploy/require-staging-success.mjs
      - name: Audit saved routes before migration (read only)
        run: node scripts/deploy/evening-readiness-audit.mjs
      - name: Retain coded readiness checkpoint before migration
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: readiness-before-production-${{ github.sha }}
          path: |
            ${{ runner.temp }}/duindorp-evening-baseline/audit.json
            ${{ runner.temp }}/duindorp-evening-baseline/calendar.json
            ${{ runner.temp }}/duindorp-evening-baseline/proposal.json
          retention-days: 14
          if-no-files-found: error
      - name: Verify the canonical live portal hotfix with production credentials
        run: node scripts/deploy/repair-portal-hotfix-history.mjs
      - name: Export one coherent snapshot and encrypt all source backup files
        env:
          RELEASE_PG_CLIENT_DIRECTORY: ${{ runner.temp }}/duindorp-pg-clients
        run: node scripts/deploy/redesign-backup.mjs
      - name: Retain encrypted source export without claiming restore success
        id: artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: redesign-source-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/duindorp-release-backup/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
  backup-restore:
    name: Verify encrypted production backup in the isolated restore
    needs: [backup-export, release-policy]
    if: github.ref == 'refs/heads/production' && !inputs.readonly_baseline && !inputs.mail_worker_diagnostics && !inputs.database_connection_diagnostics && !inputs.database_connection_recovery
    environment:
      name: production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENVIRONMENT: production
      RELEASE_BACKUP_MODE: restore
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CHILD_CODE_ENCRYPTION_KEY: ${{ secrets.CHILD_CODE_ENCRYPTION_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned restore dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Require exact successful staging revision
        run: node scripts/deploy/require-staging-success.mjs
      - name: Fetch encrypted source export from this exact workflow run
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: ${{ needs.backup-export.outputs.artifact }}
          path: ${{ runner.temp }}/duindorp-release-backup
          merge-multiple: true
      - name: Authenticate export, restore without network and dry-run exact migrations
        run: node scripts/deploy/redesign-backup.mjs
      - name: Retain only encrypted backup files and final signed restore proof
        id: artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: redesign-backup-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/duindorp-release-backup/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
  deploy:
    name: Promote exact staging release
    if: github.ref == 'refs/heads/production' && !inputs.readonly_baseline && !inputs.mail_worker_diagnostics && !inputs.database_connection_diagnostics && !inputs.database_connection_recovery
    needs: [prepare-database-client, backup-restore, release-policy]
    environment:
      name: production
      url: https://halloween.duindorpdoet.nl
    runs-on:
      - self-hosted
      - Linux
      - X64
      - dg-sites
      - production
      - duindorphalloweenprod
    timeout-minutes: 40
    env:
      APP_ENVIRONMENT: production
      RELEASE_READ_TRANSPORT: session-pooler
      APP_REVISION: ${{ github.sha }}
      APP_URL: https://halloween.duindorpdoet.nl
      NEXT_PUBLIC_SITE_URL: https://halloween.duindorpdoet.nl
      ALLOWED_ORIGINS: https://halloween.duindorpdoet.nl
      AUTH_SITE_URL: https://halloween.duindorpdoet.nl
      EVENT_SLUG: duindorp-halloween-2026
      EVENT_TIMEZONE: Europe/Amsterdam
      REGISTRATION_MODE: live
      AUTH_MAIL_MODE: live
      MAIL_MODE: live
      MAIL_ALLOWED_RECIPIENTS: halloween@duindorpdoet.nl
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SKIP_MAIL_TESTS: ${{ needs.release-policy.outputs.skip_mail_tests }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      SENDGRID_SUPPRESSIONS_API_KEY: ${{ secrets.SENDGRID_SUPPRESSIONS_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_ADMIN_API_KEY: ${{ secrets.RESEND_ADMIN_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      RESEND_ACCEPTANCE_EVENT_ID: ${{ vars.RESEND_ACCEPTANCE_EVENT_ID }}
      MAIL_IDENTITY_SECRET: ${{ secrets.MAIL_IDENTITY_SECRET }}
      MAIL_ADMIN_USER_IDS: ${{ secrets.MAIL_ADMIN_USER_IDS || vars.MAIL_ADMIN_USER_IDS }}
      SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY: ${{ secrets.SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY }}
      SENDGRID_API: ${{ secrets.SENDGRID_API }}
      SENDGRID_API_BASE_URL: ${{ vars.SENDGRID_API_BASE_URL || 'https://api.sendgrid.com/v3' }}
      SENDGRID_FROM_EMAIL: halloween@duindorpdoet.nl
      SENDGRID_FROM_NAME: De Duindorpse Poorten van Halloween
      SENDGRID_REPLY_TO: halloween@duindorpdoet.nl
      SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET }}
      EVENT_WEBHOOK_REQUIRED: "true"
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      PORTAL_CODE_PEPPER: ${{ secrets.PORTAL_CODE_PEPPER }}
      CHILD_CODE_PEPPER: ${{ secrets.CHILD_CODE_PEPPER }}
      CHILD_CODE_ENCRYPTION_KEY: ${{ secrets.CHILD_CODE_ENCRYPTION_KEY }}
      POORTENBOEK_DEMO_ENABLED: "false"
      REDACTIEKAMER_ENABLED: "true"
      NEWSLETTER_SENDING_ENABLED: "true"
      WEB_PUSH_SENDING_ENABLED: "true"
      EDITORIAL_TOKEN_SECRET: ${{ secrets.EDITORIAL_TOKEN_SECRET }}
      ABUSE_HASH_SECRET: ${{ secrets.ABUSE_HASH_SECRET }}
      ORGANIZATION_SUPPORT_EMAIL: halloween@duindorpdoet.nl
      ORGANIZATION_EVENT_PHONE: "0659019035"
      GITHUB_TOKEN: ${{ github.token }}
      DG_RUNTIME_ENV_KEYS: >-
        APP_ENVIRONMENT APP_REVISION APP_URL NEXT_PUBLIC_SITE_URL ALLOWED_ORIGINS AUTH_SITE_URL
        EVENT_SLUG EVENT_TIMEZONE REGISTRATION_MODE MAIL_MODE AUTH_MAIL_MODE MAIL_ALLOWED_RECIPIENTS
        NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY
        NEXT_PUBLIC_VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT
        REDACTIEKAMER_ENABLED NEWSLETTER_SENDING_ENABLED WEB_PUSH_SENDING_ENABLED EDITORIAL_TOKEN_SECRET
        SENDGRID_API SENDGRID_FROM_EMAIL SENDGRID_FROM_NAME SENDGRID_REPLY_TO SEND_EMAIL_HOOK_SECRET
        RESEND_API_KEY RESEND_WEBHOOK_SECRET RESEND_ADMIN_API_KEY MAIL_ADMIN_USER_IDS
        SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY
        CRON_SECRET PORTAL_CODE_PEPPER ABUSE_HASH_SECRET CHILD_CODE_PEPPER CHILD_CODE_ENCRYPTION_KEY POORTENBOEK_DEMO_ENABLED ORGANIZATION_SUPPORT_EMAIL ORGANIZATION_EVENT_PHONE
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify dedicated runner boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "duindorphalloweenprod"
          test "${RUNNER_NAME}" = "dg-sites-vps-01-duindorphalloweenprod-01"
          [[ "${GITHUB_WORKSPACE}" == /srv/sites/duindorphalloweenprod/actions-runner/_work/* ]]
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Require exact successful staging revision
        run: node scripts/deploy/require-staging-success.mjs
      - name: Fetch the same immutable public clients for production verification
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: ${{ needs.prepare-database-client.outputs.artifact }}
          path: ${{ runner.temp }}/duindorp-pg-clients
          merge-multiple: true
      - name: Verify and select the proven production libpq read client
        env:
          RELEASE_PG_CLIENT_DIRECTORY: ${{ runner.temp }}/duindorp-pg-clients
        run: |
          set -euo pipefail
          node scripts/deploy/portable-postgres-clients.mjs verify "${RELEASE_PG_CLIENT_DIRECTORY}"
          printf 'RELEASE_PG_CLIENT_DIRECTORY=%s\n' "${RELEASE_PG_CLIENT_DIRECTORY}" >> "${GITHUB_ENV}"
          printf 'RELEASE_READ_CLIENT=libpq\n' >> "${GITHUB_ENV}"
      - name: Validate production configuration
        run: node scripts/deploy/validate-environment.mjs production
      - name: Fetch encrypted release backup for private retention
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: ${{ needs.backup-restore.outputs.artifact }}
          path: ${{ runner.temp }}/duindorp-release-backup
          merge-multiple: true
      - name: Inspect actual finale window and anonymized timing alternatives (read only)
        run: node scripts/deploy/inspect-finale-planning.mjs
      - name: Validate application
        env:
          RELEASE_READ_CLIENT: ''
          RELEASE_PG_CLIENT_DIRECTORY: ''
        run: pnpm verify
      - name: Diagnose worker result RPC before migration (no delivery)
        run: node scripts/deploy/diagnose-mail-worker.mjs
      # Capture the strict preservation baseline after read-only application
      # checks, immediately before migration, to limit concurrent-user drift.
      - name: Protect redesign migrations with private preflight and restore gate
        env:
          RELEASE_BACKUP_DIRECTORY: ${{ runner.temp }}/duindorp-release-backup
        run: node scripts/deploy/redesign-preflight.mjs
      - name: Migrate production database through the verified session pooler
        env:
          PGOPTIONS: '-c lock_timeout=5000 -c statement_timeout=300000'
        run: |
          set -euo pipefail
          node scripts/deploy/migrate-production-direct.mjs
      - name: Compare existing production data before deploying the application
        run: node scripts/deploy/redesign-postmigration.mjs
      - name: Initialize central provider configuration without activation
        run: node scripts/deploy/bootstrap-mail-config.mjs
      - name: Automatically preserve SendGrid suppressions
        run: node scripts/deploy/import-mail-suppressions.mjs
      - name: Provision own signed Resend webhook
        run: node scripts/deploy/configure-resend-webhook.mjs
      - name: Deploy shared signed email hook
        run: |
          set -euo pipefail
          pnpm exec supabase secrets set --project-ref "${SUPABASE_PROJECT_REF}" \
            "RESEND_API_KEY=${RESEND_API_KEY}" \
            "MAIL_IDENTITY_SECRET=${MAIL_IDENTITY_SECRET}" \
            "SENDGRID_API_KEY=${SENDGRID_API}" \
            "SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}" \
            "SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME}" \
            "SENDGRID_REPLY_TO=${SENDGRID_REPLY_TO}" \
            "AUTH_SITE_URL=${AUTH_SITE_URL}" \
            "SEND_EMAIL_HOOK_SECRET=${SEND_EMAIL_HOOK_SECRET}" \
            "MAIL_MODE=${MAIL_MODE}" \
            "AUTH_MAIL_MODE=${AUTH_MAIL_MODE}" \
            "MAIL_ALLOWED_RECIPIENTS=${MAIL_ALLOWED_RECIPIENTS}" \
            "APP_ENVIRONMENT=production" \
            "NEWSLETTER_SENDING_ENABLED=${NEWSLETTER_SENDING_ENABLED}"
          pnpm exec supabase functions deploy send-email-hook --project-ref "${SUPABASE_PROJECT_REF}" --no-verify-jwt --use-api
      - name: Retain signed SendGrid webhook for migration history
        run: node scripts/deploy/configure-sendgrid-webhook.mjs
      - name: Deploy through the Sites VPS interface
        run: |
          /usr/local/bin/dg-site-deploy \
            duindorphalloweenprod \
            "${GITHUB_WORKSPACE}" \
            "${GITHUB_SHA}" \
            "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Configure participant registration, Auth and scheduler
        run: node scripts/deploy/configure-supabase.mjs
      - name: Check Supabase security advisors
        run: node scripts/deploy/check-security-advisors.mjs
      - name: Verify deployed production release
        run: node scripts/deploy/verify-deployment.mjs production "${APP_URL}"
      - name: Measure complete Startregie reads with real production groups without publication
        run: node scripts/deploy/check-startregie-reads.mjs
      - name: Audit saved routes after deployment (read only)
        run: node scripts/deploy/evening-readiness-audit.mjs
      - name: Retain coded readiness report after deployment
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: readiness-after-production-${{ github.sha }}
          path: |
            ${{ runner.temp }}/duindorp-evening-baseline/audit.json
            ${{ runner.temp }}/duindorp-evening-baseline/calendar.json
            ${{ runner.temp }}/duindorp-evening-baseline/proposal.json
          retention-days: 14
          if-no-files-found: error
      - name: Verify text status RPC through the real service role route
        run: node scripts/deploy/diagnose-mail-worker.mjs --require-v2
      - name: Activate Resend default for the authorized exact release
        env:
          RESEND_DEFAULT_RELEASE_SHA: ${{ vars.RESEND_DEFAULT_RELEASE_SHA }}
          MAIL_TEST_WAIVER_SHA: ${{ vars.MAIL_TEST_WAIVER_SHA }}
          MAIL_TEST_WAIVER_EXPIRES_AT: ${{ vars.MAIL_TEST_WAIVER_EXPIRES_AT }}
          MAIL_TEST_WAIVER_REASON: ${{ vars.MAIL_TEST_WAIVER_REASON }}
        run: node scripts/deploy/activate-resend-release.mjs
      - name: Validate active mail configuration without sending
        if: env.SKIP_MAIL_TESTS != 'true'
        run: node scripts/deploy/verify-mail-provider.mjs
      - name: Exercise signed Resend Event Webhook
        if: env.SKIP_MAIL_TESTS != 'true' && env.MAIL_ACTIVE_PROVIDER == 'resend'
        run: node scripts/deploy/test-resend-webhook.mjs
      - name: Exercise signed SendGrid Event Webhook
        if: env.SKIP_MAIL_TESTS != 'true' && env.MAIL_ACTIVE_PROVIDER == 'sendgrid'
        run: node scripts/deploy/test-sendgrid-webhook.mjs
