name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      runner_maintenance:
        description: 'Inspect the dedicated staging runner or clear only rebuildable build caches; does not deploy'
        type: choice
        default: none
        required: false
        options:
          - none
          - inspect
          - clear-build-cache
          - compact-git-checkout
          - inspect-mail-gateway
          - inspect-portal-onboarding
          - restore-mail-send
          - replace-mail-key
      mail_repair_public_key:
        description: 'Public RSA key for encrypted transport of a verified replacement credential'
        type: string
        required: false
