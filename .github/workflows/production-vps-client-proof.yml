name: Read-only production VPS client proof

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  proof:
    if: github.repository == 'duindorpdoet/platform' && github.ref == 'refs/heads/production' && github.event_name == 'workflow_dispatch'
    environment:
      name: production
      deployment: false
    runs-on: [self-hosted, Linux, X64, dg-sites, production, duindorphalloweenprod]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false
          ref: ${{ github.sha }}
      - name: Verify existing dedicated production VPS runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "duindorphalloweenprod"
          test "${RUNNER_NAME}" = "dg-sites-vps-01-duindorphalloweenprod-01"
          [[ "${GITHUB_WORKSPACE}" == /srv/sites/duindorphalloweenprod/actions-runner/_work/* ]]
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fetch immutable already prepared public clients
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          artifact-ids: '13033476508'
          run-id: '41176196120'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/duindorp-vps-proof-clients
          merge-multiple: true
      - name: Verify all fixed client hashes and read each endpoint once
        env:
          APP_ENVIRONMENT: production
          RELEASE_PG_CLIENT_DIRECTORY: ${{ runner.temp }}/duindorp-vps-proof-clients
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/deploy/production-vps-client-proof.mjs
      - name: Retain only sanitized connection proof
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: production-vps-client-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/duindorp-vps-client-proof/report.json
          if-no-files-found: warn
          retention-days: 7
