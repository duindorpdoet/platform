name: Redesign authenticated acceptance
on:
  push:
    branches: [codex/complete-halloween-redesign]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/redesign-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: redesign-authenticated-ui
  cancel-in-progress: true
jobs:
  authenticated:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENVIRONMENT: test
      REGISTRATION_MODE: staging_test
      APP_URL: http://127.0.0.1:3100
      ALLOWED_ORIGINS: http://127.0.0.1:3100
      ABUSE_HASH_SECRET: local-ci-portal-registration-hash-secret
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Start isolated real Supabase services and synthetic fixtures
        run: |
          pnpm exec supabase start >/tmp/duindorp-supabase-start.log 2>&1
          pnpm exec supabase db reset
      - name: Build for local Auth and API
        run: |
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exercise authenticated navigation and privacy before the full regression suite
        run: |
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY" pnpm exec playwright test tests/e2e/authenticated-live.spec.ts tests/e2e/homeowner-responsive.spec.ts tests/e2e/participant-mobile-polish.spec.ts tests/e2e/together-management.spec.ts --project=desktop-chromium --workers=1 --retries=0 --max-failures=5
      - name: Save only synthetic fixture screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: redesign-authenticated-fixture-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
  child-book:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENVIRONMENT: staging
      POORTENBOEK_DEMO_ENABLED: 'true'
      REGISTRATION_MODE: staging_test
      APP_URL: https://127.0.0.1:3443
      ALLOWED_ORIGINS: https://127.0.0.1:3443,http://127.0.0.1:3100
      ABUSE_HASH_SECRET: local-ci-portal-registration-hash-secret
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Start isolated real Supabase services and synthetic fixtures
        run: |
          pnpm exec supabase start >/tmp/duindorp-supabase-start.log 2>&1
          pnpm exec supabase db reset
      - name: Build for local HTTPS Auth and API
        run: |
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL=https://127.0.0.1:3444 NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Exercise real child sessions, identity switches and first-use guides
        run: |
          eval "$(pnpm exec supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY"
          export CHILD_CODE_PEPPER="$(openssl rand -base64 32)" CHILD_CODE_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          pnpm exec playwright test --config playwright.poortenboek.config.ts --retries=0 --max-failures=4
      - name: Save only synthetic fixture screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: redesign-child-fixture-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
