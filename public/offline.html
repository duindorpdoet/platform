<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08101e" />
    <title>Geen verbinding · De Poorten</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #08101e; color: #f7efe4; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 75% 15%, #273446 0, transparent 32%), #08101e; }
      main { width: min(100%, 520px); border: 1px solid #3d4b5d; border-radius: 24px; padding: clamp(28px, 8vw, 52px); background: #111c29; box-shadow: 0 28px 80px #0008; }
      img { width: 156px; height: auto; }
      p:first-of-type { color: #f1b777; font-size: .75rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-family: Georgia, serif; font-size: clamp(2.2rem, 10vw, 4rem); line-height: .95; }
      p { color: #bdc8d4; line-height: 1.65; }
      button { margin-top: 14px; width: 100%; border: 0; border-radius: 12px; padding: 15px 20px; background: #f1b777; color: #15100b; font: inherit; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/logo.webp" alt="De Duindorpse Poorten van Halloween" />
      <p>Even geen verbinding</p>
      <h1>De poort blijft dicht.</h1>
      <p>Maak opnieuw verbinding om je persoonlijke omgeving te openen. Persoonlijke pagina’s en gegevens bewaren we niet in de offline cache.</p>
      <button type="button" onclick="location.reload()">Opnieuw proberen</button>
    </main>
  </body>
</html>
